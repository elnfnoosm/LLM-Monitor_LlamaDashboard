[project]
name = "llamadashboard"
version = "0.3.0"
description = "Terminal dashboard for llama.cpp: device + model runtime monitoring, cooperating with (but decoupled from) user run.bat launch recipes."
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
    "psutil>=5.9",
    "nvidia-ml-py>=12.535",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
llamadashboard = "llamadashboard.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llamadashboard*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore:The pynvml package is deprecated.*:FutureWarning"]
